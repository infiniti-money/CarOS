});on('openControls',()=>{controls=true;renderDock()});on('closeControls',()=>{controls=false;renderDock()});on('themeToggle',()=>setTheme(document.body.dataset.theme==='dark'?'light':'dark'));on('themeToggle2',()=>setTheme(document.body.dataset.theme==='dark'?'light':'dark'));on('brightDown',()=>toast('Web không chỉnh được độ sáng hệ thống.'));on('brightUp',()=>toast('Web không chỉnh được độ sáng hệ thống.'));on('dockPlay',toggleAudio);on('prev',()=>{if(Number.isFinite(audio.duration))audio.currentTime=Math.max(0,audio.currentTime-10)});on('forward',()=>{if(Number.isFinite(audio.duration))audio.currentTime=Math.min(audio.duration,audio.currentTime+10)});on('volDown',()=>{audioVolume=Math.max(0,audioVolume-.1);audio.volume=audioVolume;toast('Âm lượng trình phát '+Math.round(audioVolume*100)+'%')});on('volUp',()=>{audioVolume=Math.min(1,audioVolume+.1);audio.volume=audioVolume;toast('Âm lượng trình phát '+Math.round(audioVolume*100)+'%')});on('mute',()=>{audio.muted=!audio.muted;toast(audio.muted?'Đã tắt tiếng':'Đã bật tiếng')});on('sos',()=>confirmAction('SOS','Mở trình gọi số cấp cứu 115 tại Việt Nam? Không tự động gọi hoặc gửi vị trí.',()=>location.href='tel:115'));clock()}
function clock(){if($('clock'))$('clock').textContent=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',hour12:false})}setInterval(clock,1000);function validNumber(v){return /^\+?[0-9]{3,15}$/.test(v.replace(/[\s()-]/g,''))}function setNumber(v){number=v.replace(/[^0-9+]/g,'').slice(0,16);if($('dial'))$('dial').value=number;if($('call'))$('call').disabled=!validNumber(number)}function saveContact(){if(!validNumber(number)){toast('Nhập số hợp lệ');return}const name=prompt('Tên liên hệ (tùy chọn)','');if(name===null)return;const item={name:name.trim().slice(0,80),number};contacts=contacts.filter(x=>x.number!==number);contacts.push(item);favorites=favorites.filter(x=>x.number!==number);favorites.push(item);storage.set('contacts',contacts);storage.set('favorites',favorites);toast('Đã lưu liên hệ và yêu thích')}function startGPS(){if(!navigator.geolocation){toast('GPS không được hỗ trợ');return}if(watch!==null){toast('GPS đang bật');return}watch=navigator.geolocation.watchPosition(p=>{pos={lat:p.coords.latitude,lon:p.coords.longitude,time:p.timestamp};speed=p.coords.speed;if($('dockSpeed'))$('dockSpeed').textContent=speed===null?'—':Math.round(speed*3.6);if($('parkInfo'))$('parkInfo').textContent=parkText();toast('Đã nhận vị trí GPS thực')},e=>{toast('GPS: '+e.message);if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null},{enableHighAccuracy:true,maximumAge:0,timeout:15000})}function parkText(){if(!parking)return 'Chưa lưu vị trí đỗ xe';let s='Đỗ từ '+new Date(parking.time).toLocaleString('vi-VN');if(pos){const a=(pos.lat-parking.lat)*Math.PI/180,b=(pos.lon-parking.lon)*Math.PI/180;const h=Math.sin(a/2)**2+Math.cos(pos.lat*Math.PI/180)*Math.cos(parking.lat*Math.PI/180)*Math.sin(b/2)**2;s+=' · '+Math.round(12742000*Math.asin(Math.sqrt(Math.min(1,h))))+' m đường chim bay'}return s}function mapTransform(){$('mapart').style.transform=`scale(${zoom}) ${pitch?'perspective(900px) rotateX(20deg)':''}`}function toggleAudio(){if(!audio.src){toast('Chọn tệp hoặc URL âm thanh trước');return}if(audio.paused)audio.play().catch(e=>toast('Không thể phát: '+e.message));else audio.pause();renderDock();if($('audioState'))$('audioState').textContent=audio.paused?'Đang dừng':'Đang phát'}function loadAudio(url){if(mediaUrl)URL.revokeObjectURL(mediaUrl);mediaUrl=url.startsWith('blob:')?url:'';audio.src=url;audio.volume=audioVolume;audio.play().then(()=>{if($('audioState'))$('audioState').textContent='Đang phát';renderDock()}).catch(e=>toast('Không phát được âm thanh: '+e.message))}function stopCamera(){if(recorder?.state==='recording')recorder.stop();if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=+b.dataset.page;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>setNumber(number+b.dataset.digit));document.querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>{let rows=tab==='recent'?recent:tab==='favorites'?favorites:contacts;number=rows[+b.dataset.contact].number;tab='keypad';render()});document.querySelectorAll('[data-wall]').forEach(b=>{if(b.tagName==='BUTTON')b.onclick=()=>setWall(b.dataset.wall)});document.querySelectorAll('button[data-theme]').forEach(b=>b.onclick=()=>{setTheme(b.dataset.theme);render()});document.querySelectorAll('[data-hide]').forEach(b=>b.onclick=()=>{let i=+b.dataset.hide;hiddenApps=hiddenApps.includes(i)?hiddenApps.filter(x=>x!==i):[...hiddenApps,i];storage.set('hidden',hiddenApps);render()});document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let [i,d]=b.dataset.move.split(',').map(Number);[layout[i],layout[i+d]]=[layout[i+d],layout[i]];storage.set('layout',layout);render()});const on=(id,fn)=>{if($(id))$(id).onclick=fn};on('del',()=>setNumber(number.slice(0,-1)));if($('dial'))$('dial').oninput=e=>setNumber(e.target.value);on('call',()=>{if(validNumber(number))confirmAction('Gọi điện',`Mở trình gọi số ${number}?`,()=>{recent=[{name:contacts.find(c=>c.number===number)?.name||'',number},...recent.filter(x=>x.number!==number)].slice(0,20);storage.set('recent',recent);location.href='tel:'+number})});on('saveContact',saveContact);on('pickContact',async()=>{try{if(navigator.contacts&&navigator.contacts.select){let [c]=await navigator.contacts.select(['name','tel'],{multiple:false});if(c?.tel?.[0]){number=c.tel[0].replace(/[^0-9+]/g,'');tab='keypad';render();return}}}catch(e){toast('Không lấy được liên hệ')}tab='keypad';render()});if($('wallFile'))$('wallFile').onchange=e=>{const f=e.target.files[0];if(f){if(wallPhoto)URL.revokeObjectURL(wallPhoto);wallPhoto=URL.createObjectURL(f);theme();toast('Ảnh nền chỉ dùng trong phiên này')}};on('gpsStart',startGPS);on('gpsStartMap',startGPS);on('parkSave',()=>{if(!pos||Date.now()-pos.time>30000){toast('Cần GPS thực mới để lưu chỗ đỗ');return}parking={...pos,time:Date.now()};storage.set('parking',parking);render();toast('Đã lưu chỗ đỗ')});on('openPark',()=>{if(parking)window.open(`https://www.google.com/maps/search/?api=1&query=${parking.lat},${parking.lon}`,'_blank','noopener')});on('timer',()=>toast(parking?parkText():'Chưa bắt đầu thời gian đỗ'));if($('parkPhoto'))$('parkPhoto').onchange=e=>{if(e.target.files[0]){if(photoUrl)URL.revokeObjectURL(photoUrl);photoUrl=URL.createObjectURL(e.target.files[0]);render()}};on('plus',()=>{zoom=Math.min(3,zoom+.25);mapTransform()});on('minus',()=>{zoom=Math.max(.75,zoom-.25);mapTransform()});on('pitch',()=>{pitch=!pitch;render();toast('Góc nghiêng sơ đồ minh họa, không phải địa hình 3D thật')});if($('searchMap'))$('searchMap').onsubmit=e=>{e.preventDefault();const q=$('destination').value.trim();if(q)window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q),'_blank','noopener')};on('mic',()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast('Trình duyệt không hỗ trợ nhận dạng giọng nói');return}try{const r=new R();r.lang='vi-VN';r.onresult=e=>{if($('destination'))$('destination').value=e.results[0][0].transcript};r.onerror=()=>toast('Không nhận dạng được');r.start()}catch{toast('Không mở được microphone')}});if($('musicFile'))$('musicFile').onchange=e=>{if(e.target.files[0])loadAudio(URL.createObjectURL(e.target.files[0]))};on('loadAudio',()=>{try{let u=new URL($('audioUrl').value);if(u.protocol!=='https:'||u.username||u.password)throw Error();loadAudio(u.href)}catch{toast('Nhập URL HTTPS hợp lệ')}});on('playAudio',toggleAudio);on('stopAudio',()=>{audio.pause();audio.currentTime=0;renderDock();if($('audioState'))$('audioState').textContent='Đã dừng'});on('cameraOn',async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Cần HTTPS hoặc localhost');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});if(screen!=='camera'){stopCamera();return}$('camera').srcObject=stream;$('record').disabled=false}catch(e){toast('Camera: '+e.message)}});on('record',()=>{try{if(!stream||!window.MediaRecorder)throw Error('Không hỗ trợ quay');if(recorder?.state==='recording'){recorder.stop();return}chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{if($('record'))$('record').textContent='Quay video';if($('videoLink')){const url=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));$('videoLink').href=url;$('videoLink').download='caros-video.'+(recorder.mimeType.includes('mp4')?'mp4':'webm');$('videoLink').hidden=false}chunks=[]};recorder.start(1000);$('record').textContent='Dừng quay';setTimeout(()=>{if(recorder?.state==='recording')recorder.stop()},60000)}catch(e){toast(e.message)}});on('cameraOff',()=>{stopCamera();if($('camera'))$('camera').srcObject=null;if($('record'))$('record').disabled=true});on('erase',()=>confirmAction('Xóa dữ liệu','Xóa các liên hệ, ghi chú, vị trí đỗ và tùy chọn cục bộ?',()=>{for(const k of ['contacts','favorites','recent','parking','notes','theme','wall','layout','hidden'])storage.set(k,null);contacts=[];favorites=[];recent=[];parking=null;notes=[];hiddenApps=[];layout=apps.map((_,i)=>i);appearance='dark';wall='dune';if(wallPhoto)URL.revokeObjectURL(wallPhoto);wallPhoto=null;if(photoUrl)URL.revokeObjectURL(photoUrl);photoUrl='';render();toast('Đã xóa dữ liệu nguyên mẫu')}));on('export',()=>{const blob=new Blob([JSON.stringify({contacts,favorites,recent,parking,notes},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='caros-local-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});if($('noteForm'))$('noteForm').onsubmit=e=>{e.preventDefault();notes.push({text:$('noteText').value,date:$('noteDate').value});storage.set('notes',notes);render()}}
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{if(appearance==='auto')theme()});document.addEventListener('visibilitychange',()=>{if(document.hidden){if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;speed=null;pos=null;stopCamera();if($('dockSpeed'))$('dockSpeed').textContent='—'}});let touchX=0;$('main').addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});$('main').addEventListener('touchend',e=>{if(screen==='home'&&Math.abs(e.changedTouches[0].clientX-touchX)>65){page=Math.max(0,Math.min(1,page+(e.changedTouches[0].clientX<touchX?1:-1)));render()}},{passive:true});render();
