name: Verify and deploy CarOS Web
on:
  pull_request:
    paths: ['webapp/**', 'scripts/generate_web_icons.py', '.github/workflows/webapp.yml']
  push:
    branches: [main]
    paths: ['webapp/**', 'scripts/generate_web_icons.py', '.github/workflows/webapp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/generate_web_icons.py
      - name: Vendor pinned MapLibre GL JS
        run: |
          mkdir -p webapp/vendor
          npm pack maplibre-gl@6.19.0 --ignore-scripts --pack-destination /tmp
          tar -xzf /tmp/maplibre-gl-6.19.0.tgz -C /tmp
          cp /tmp/package/dist/maplibre-gl.mjs /tmp/package/dist/maplibre-gl.css webapp/vendor/
          cp /tmp/package/LICENSE* webapp/vendor/
          test -s webapp/vendor/maplibre-gl.mjs
      - run: node --check webapp/app.js && node --check webapp/sw.js && node --check webapp/map.mjs && node --check webapp/terrain.mjs && node --check webapp/media.mjs && node --test webapp/*.test.mjs
      - run: python3 -m json.tool webapp/manifest.webmanifest > /dev/null
      - run: rm webapp/*.test.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: webapp
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
