name: Verify and deploy CarOS Web
on:
  pull_request:
    paths: ['webapp/**', 'scripts/generate_web_icons.py', 'scripts/webapp-e2e.cjs', '.github/workflows/webapp.yml']
  push:
    branches: [main]
    paths: ['webapp/**', 'scripts/generate_web_icons.py', 'scripts/webapp-e2e.cjs', '.github/workflows/webapp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/generate_web_icons.py
      - name: Vendor pinned MapLibre GL JS
        run: |
          mkdir -p webapp/vendor
          npm pack maplibre-gl@6.19.0 --ignore-scripts --pack-destination /tmp
          tar -xzf /tmp/maplibre-gl-6.19.0.tgz -C /tmp
          cp /tmp/package/dist/maplibre-gl.mjs /tmp/package/dist/maplibre-gl.css webapp/vendor/
          cp /tmp/package/LICENSE* webapp/vendor/
          test -s webapp/vendor/maplibre-gl.mjs
      - run: node --check webapp/app.js && node --check webapp/sw.js && node --check webapp/map.mjs && node --check webapp/terrain.mjs && node --check webapp/media.mjs && node --test webapp/*.test.mjs
      - run: python3 -m json.tool webapp/manifest.webmanifest > /dev/null
      - name: Install pinned browser test runner
        run: |
          npm install --prefix /tmp/caros-e2e --no-audit --no-fund playwright@1.56.1
          /tmp/caros-e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory webapp >/tmp/caros-web-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          NODE_PATH=/tmp/caros-e2e/node_modules node --test scripts/webapp-e2e.cjs
      - run: rm webapp/*.test.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: webapp
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
