name: Verify pinned CarPlay dependency

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify_${{ github.workflow }}_${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Dart analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify pinned dependency and checkout
        run: |
          PIN=$(python3 -c 'import re; from pathlib import Path; s=Path("pubspec.yaml").read_text(); print(re.search(r"flutter_carplay:\s*\n\s*git:\s*\n\s*url: https://github.com/infiniti-money/carplay.git\s*\n\s*ref: ([0-9a-f]{40})", s).group(1))')
          test "$PIN" = b457538fab39aa2cac112bfc4c23cad749ada4dd
          git clone --no-checkout https://github.com/infiniti-money/carplay.git flutter_carplay
          git -C flutter_carplay checkout --detach "$PIN"
          test "$(git -C flutter_carplay rev-parse HEAD)" = "$PIN"
          echo "Pinned CarPlay commit: $PIN" >> "$GITHUB_STEP_SUMMARY"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: flutter_carplay
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
        working-directory: flutter_carplay
      - run: flutter analyze
        working-directory: flutter_carplay
      - run: flutter test
        working-directory: flutter_carplay
      - run: flutter pub get
        working-directory: flutter_carplay/example
      - run: flutter analyze
        working-directory: flutter_carplay/example
      - run: flutter test
        working-directory: flutter_carplay/example

  ios:
    name: iOS example build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify pinned dependency and checkout
        run: |
          PIN=$(python3 -c 'import re; from pathlib import Path; s=Path("pubspec.yaml").read_text(); print(re.search(r"flutter_carplay:\s*\n\s*git:\s*\n\s*url: https://github.com/infiniti-money/carplay.git\s*\n\s*ref: ([0-9a-f]{40})", s).group(1))')
          test "$PIN" = b457538fab39aa2cac112bfc4c23cad749ada4dd
          git clone --no-checkout https://github.com/infiniti-money/carplay.git flutter_carplay
          git -C flutter_carplay checkout --detach "$PIN"
          test "$(git -C flutter_carplay rev-parse HEAD)" = "$PIN"
          echo "Pinned CarPlay commit: $PIN" >> "$GITHUB_STEP_SUMMARY"
      - run: sudo xcode-select --switch /Applications/Xcode_26.5.app
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: flutter_carplay/example
      - run: flutter build ios --simulator --debug
        working-directory: flutter_carplay/example
      - run: flutter build ios --simulator --debug --target lib/voice_control_main.dart
        working-directory: flutter_carplay/example
      - name: Build conversational app entitlement configuration
        run: >-
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          FLUTTER_TARGET=lib/voice_control_main.dart
          CARPLAY_ENTITLEMENTS_FILE=Conversational.entitlements build
        working-directory: flutter_carplay/example
      - name: Run native CarPlay regressions
        working-directory: flutter_carplay
        run: |
          gem install xcodeproj --user-install --no-document
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,rows in d["devices"].items() for x in rows if "iOS-26-" in runtime and "iPhone" in x["name"]))')
          ruby ios/test/run_tests.rb "$RUNNER_TEMP/carplay_tests" "$DEVICE"

  android:
    name: Android example release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify pinned dependency and checkout
        run: |
          PIN=$(python3 -c 'import re; from pathlib import Path; s=Path("pubspec.yaml").read_text(); print(re.search(r"flutter_carplay:\s*\n\s*git:\s*\n\s*url: https://github.com/infiniti-money/carplay.git\s*\n\s*ref: ([0-9a-f]{40})", s).group(1))')
          test "$PIN" = b457538fab39aa2cac112bfc4c23cad749ada4dd
          git clone --no-checkout https://github.com/infiniti-money/carplay.git flutter_carplay
          git -C flutter_carplay checkout --detach "$PIN"
          test "$(git -C flutter_carplay rev-parse HEAD)" = "$PIN"
          echo "Pinned CarPlay commit: $PIN" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: flutter_carplay/example
      - run: flutter build apk --release
        working-directory: flutter_carplay/example
      - name: Run native Android regressions
        run: ./gradlew :flutter_carplay:testDebugUnitTest --console=plain
        working-directory: flutter_carplay/example/android
